name: Trigo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
packages:
  TrigoNative:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    TRIGO_WORKTREE_ID: ${TRIGO_WORKTREE_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  App:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        TrigoWorktreeID: $(TRIGO_WORKTREE_ID)
    dependencies:
      - package: TrigoNative
targets:
  Trigo:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo
        PRODUCT_NAME: Trigo
  Trigo Dev:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo.dev
        PRODUCT_NAME: Trigo Dev
schemes:
  Trigo:
    build:
      targets:
        Trigo: all
    archive:
      config: Release
  Trigo Dev:
    build:
      targets:
        Trigo Dev: all
    archive:
      config: Release
