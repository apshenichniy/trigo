name: Trigo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
packages:
  TrigoNative:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    TRIGO_WORKTREE_ID: ${TRIGO_WORKTREE_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  App:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        TrigoWorktreeID: $(TRIGO_WORKTREE_ID)
        LSUIElement: true
        NSScreenCaptureUsageDescription: Trigo records audio from your selected application into a local call archive. No screen images are saved.
        NSMicrophoneUsageDescription: Trigo records your microphone as a separate audio track in your local call archive.
    dependencies:
      - package: TrigoNative
        product: TrigoDesktop
targets:
  Trigo:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo
        PRODUCT_NAME: Trigo
  Trigo Dev:
    templates: [App]
    info:
      path: Generated/Dev-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo.dev
        PRODUCT_NAME: Trigo Dev
  Trigo UI Fixture:
    type: application
    platform: macOS
    sources:
      - path: UIFixtures
      - path: ../../packages/contracts/fixtures/call.json
        buildPhase: resources
      - path: ../../packages/contracts/fixtures/valid-audio.json
        buildPhase: resources
      - path: ../../packages/contracts/fixtures/grouping-revision.json
        buildPhase: resources
    dependencies:
      - package: TrigoNative
        product: TrigoDesktop
      - package: TrigoNative
        product: TrigoNative
    info:
      path: Generated/UIFixture-Info.plist
      properties:
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo.fixture.desktop
        PRODUCT_NAME: Trigo UI Fixture
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_TESTABILITY: YES
  Trigo UI Focus Fixture:
    type: application
    platform: macOS
    sources: [UIFocusFixture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo.fixture.focus
        PRODUCT_NAME: Trigo UI Focus Fixture
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  TrigoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Trigo UI Fixture
      - target: Trigo UI Focus Fixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.apshenichniy.trigo.fixture.desktop.uitests
        TEST_TARGET_NAME: Trigo UI Fixture
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Trigo:
    build:
      targets:
        Trigo: all
    archive:
      config: Release
  Trigo Dev:
    build:
      targets:
        Trigo Dev: all
    archive:
      config: Release
  Trigo UI:
    build:
      targets:
        Trigo UI Fixture: all
        Trigo UI Focus Fixture: all
        TrigoUITests: [test]
    test:
      config: Debug
      targets: [TrigoUITests]
      parallelizable: false
      randomExecutionOrder: false
